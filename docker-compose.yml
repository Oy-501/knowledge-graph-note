# 生产编排：一条命令起「前端静态站 + 后端 API」，默认 SQLite
# 首次使用：cp .env.docker.example .env && 修改 ADMIN_TOKEN，然后 docker compose up -d
# 可选 PostgreSQL：DB_MODE=postgres DATABASE_URL=postgresql://... docker compose --profile pg up -d

services:
  backend:
    build: ./backend
    environment:
      DB_MODE: ${DB_MODE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      SQLITE_PATH: /data/kg.db
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请先创建 .env 并设置 ADMIN_TOKEN（参考 .env.docker.example）}
      REGISTRATION_OPEN: "false"
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
    volumes:
      - kg_data:/data
      - model_cache:/models
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./kg-vue3
      args:
        VITE_API_BASE: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 可选：只有显式 --profile pg 时才启动
  db:
    profiles: ["pg"]
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: kg_user
      POSTGRES_PASSWORD: kg_pass
      POSTGRES_DB: knowledge_graph
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_user -d knowledge_graph"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kg_data:
  model_cache:
  pg_data:
