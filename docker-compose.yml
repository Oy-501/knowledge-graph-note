version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: kg_user
      POSTGRES_PASSWORD: kg_pass
      POSTGRES_DB: knowledge_graph
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_user -d knowledge_graph"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kg_user:kg_pass@db:5432/knowledge_graph
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./kg-vue3/src/domain_corpus:/app/domain_corpus
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    build: ./kg-vue3
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000/api
    volumes:
      - ./kg-vue3:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  pg_data:
