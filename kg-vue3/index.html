  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 22 L13 10 M13 10 L21 17 M21 17 L27 9' stroke='%2322D3EE' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='6' cy='22' r='3.4' fill='%2322D3EE'/%3E%3Ccircle cx='13' cy='10' r='2.8' fill='%238B5CF6'/%3E%3Ccircle cx='21' cy='17' r='2.8' fill='%238B5CF6'/%3E%3Ccircle cx='27' cy='9' r='3.4' fill='%2322D3EE'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0A0C13" />
  <title>知识关联图谱 · 毕设交付版</title>

  <!--
    主题首帧预置（防闪白）
    ------------------------------------------------------------
    settingsStore 在 Vue 挂载后才给 <html> 加 .dark 类。
    在那之前浏览器会先按 :root（亮色）渲染一帧 ——
    对深色为主的产品来说就是一次明显的「白闪」。
    这里在样式表之前同步读一次 localStorage，把主题类先打上。
    读不到（首次访问 / 清过缓存）时按深色处理，与本产品的默认主题一致。
  -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('kg-settings')
        var theme = raw ? (JSON.parse(raw).theme || 'dark') : 'dark'
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    })()
  </script>

  <!--
    Transformers.js 的 CDN 标签已移除，**不要再加回来**。原因（三条独立证据）：

    1. 那份 CDN 产物是 **ES 模块**，当普通脚本加载必然解析失败：
       `<script src=.../transformers.min.js>` 实测抛
       `Uncaught SyntaxError: Unexpected token 'export'`，
       同一个文件用 `import()` 解析则正常，且它内部**没有 UMD 包装头**。
       解析失败 = 整个文件一行都不执行 → `window.transformers` 永远是 undefined。
       （脚本 onload 照样会触发，所以光看「加载成功」发现不了。）

    2. 就算加载成功也没有使用方：`vectorEngine.js` 只被 import 了 `cosine` 与 `jaccard`
       两个纯数学函数；真正需要 transformers 的 `embed` / `embedBatch` / `ensureLoaded`
       **全仓没有任何调用点**，默认导出也没人 import。

    3. 代价是实打实的：每次打开页面都要下载约 898KB 的第三方脚本
       （CDN 不可达时按 TCP 超时算会卡约 21s），换来一条必然出现的控制台异常。

    移除后前端向量计算不受影响：`cosine` / `jaccard` 本来就不依赖它。
    哪天真要在浏览器里做语义向量，正确做法是
    `import(...)` 导入模块并**显式赋给 window**（ES 模块的导出不会自动变成全局），
    同时把模型换成支持中文的（`Xenova/all-mpnet-base-v2` 是纯英文模型，
    编码中文等于随机向量 —— 后端已经因为同一类问题换过模型）。
  -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
