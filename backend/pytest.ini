[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short --strict-markers
markers =
    socket_layer: 需要真起 uvicorn 子进程、走真实 TCP 的用例（较慢）
    slow_model: 需要加载真语义模型的用例（默认跳过，见 test_vector_model.py）
filterwarnings =
    ignore::DeprecationWarning
